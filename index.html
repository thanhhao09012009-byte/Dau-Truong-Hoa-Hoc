<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Hóa Học 12</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Liên kết file CSS tùy chỉnh (nếu tách file) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex flex-col font-['Montserrat',sans-serif]">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-30 shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center shadow-lg shadow-amber-500/30">
                <i class="fa-solid fa-flask text-slate-950 text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-extrabold bg-gradient-to-r from-amber-400 via-amber-200 to-yellow-400 bg-clip-text text-transparent">ĐẤU TRƯỜNG HÓA HỌC</h1>
                <p class="text-xs text-slate-400 font-medium">Hệ thống Trắc nghiệm Hóa 12</p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col justify-center items-center p-4 md:p-6 max-w-6xl mx-auto w-full">
        <!-- Start Screen -->
        <div id="start-screen" class="text-center bg-slate-900/90 backdrop-blur-xl p-6 md:p-10 rounded-3xl border border-slate-800 shadow-2xl max-w-xl w-full glow-box fade-in">
            <div class="w-20 h-20 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl mx-auto flex items-center justify-center shadow-xl shadow-amber-500/20 mb-4">
                <i class="fa-solid fa-trophy text-4xl text-slate-950"></i>
            </div>
            <h2 class="text-2xl md:text-3xl font-black text-white mb-2">Đấu Trường Hóa Học 12</h2>
            <p class="text-slate-300 text-xs md:text-sm mb-6">Chinh phục 10 câu hỏi và lưu lại điểm số cao nhất của bạn!</p>
            
            <div class="mb-5">
                <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="20" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-center text-slate-100 font-semibold focus:outline-none focus:border-amber-400 text-sm transition-all">
            </div>

            <button id="btn-start" class="w-full py-3.5 bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500 hover:from-amber-400 hover:to-amber-600 text-slate-950 font-extrabold rounded-xl text-base shadow-lg shadow-amber-500/30 transition-all mb-6 cursor-pointer">
                <i class="fa-solid fa-play mr-2"></i> BẮT ĐẦU CHƠI NGAY
            </button>

            <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800 text-left">
                <span class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center mb-2">
                    <i class="fa-solid fa-medal mr-1.5"></i> Bảng Xếp Hạng Cao Thủ
                </span>
                <div id="local-leaderboard" class="space-y-1.5 text-xs max-h-40 overflow-y-auto"></div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="w-full hidden grid grid-cols-1 lg:grid-cols-4 gap-6 items-start fade-in">
            <div class="lg:col-span-3 flex flex-col space-y-5">
                <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">CÂU HỎI <span id="current-question-num" class="text-amber-400 text-sm">1</span>/10</span>
                        <span id="current-prize" class="text-2xl font-black text-amber-400">0 Điểm</span>
                    </div>
                    <div id="timer-display" class="w-14 h-14 rounded-2xl bg-slate-950 border-2 border-amber-400 flex items-center justify-center font-black text-2xl text-amber-400 shadow-inner">30</div>
                    <div class="flex space-x-2">
                        <button id="life-5050" class="btn-lifeline" title="50:50">50:50</button>
                        <button id="life-phone" class="btn-lifeline" title="Gọi điện cho người thân"><i class="fa-solid fa-phone text-sm"></i></button>
                        <button id="life-audience" class="btn-lifeline" title="Hỏi ý kiến khán giả"><i class="fa-solid fa-users text-sm"></i></button>
                    </div>
                </div>

                <div class="bg-slate-900/90 backdrop-blur-md p-6 md:p-8 rounded-2xl border border-slate-800 shadow-xl min-h-[160px] flex items-center justify-center relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-2 bg-gradient-to-b from-amber-500 to-yellow-600"></div>
                    <p id="question-text" class="text-lg md:text-xl text-center font-semibold leading-relaxed text-slate-100"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button data-key="A" class="btn-answer p-4 text-left font-semibold text-slate-200 flex items-center space-x-3"><span class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-amber-400 font-bold shrink-0">A</span><span id="text-a" class="flex-1"></span></button>
                    <button data-key="B" class="btn-answer p-4 text-left font-semibold text-slate-200 flex items-center space-x-3"><span class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-amber-400 font-bold shrink-0">B</span><span id="text-b" class="flex-1"></span></button>
                    <button data-key="C" class="btn-answer p-4 text-left font-semibold text-slate-200 flex items-center space-x-3"><span class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-amber-400 font-bold shrink-0">C</span><span id="text-c" class="flex-1"></span></button>
                    <button data-key="D" class="btn-answer p-4 text-left font-semibold text-slate-200 flex items-center space-x-3"><span class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-amber-400 font-bold shrink-0">D</span><span id="text-d" class="flex-1"></span></button>
                </div>

                <div class="flex justify-between pt-2">
                    <button id="btn-stop" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-semibold cursor-pointer transition-all"><i class="fa-solid fa-flag mr-1"></i> Dừng cuộc chơi</button>
                    <button id="btn-restart" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-sky-400 border border-sky-500/30 rounded-xl text-xs font-semibold cursor-pointer transition-all"><i class="fa-solid fa-rotate-right mr-1"></i> Chơi lại</button>
                </div>
            </div>

            <div class="bg-slate-900/90 backdrop-blur-md p-5 rounded-2xl border border-slate-800 shadow-xl flex flex-col justify-between">
                <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                    <h3 class="font-extrabold text-slate-300 text-xs uppercase"><i class="fa-solid fa-chart-line text-amber-400 mr-1.5"></i> Thang Điểm</h3>
                </div>
                <div id="money-ladder" class="flex flex-col-reverse text-xs font-bold space-y-1 space-y-reverse"></div>
            </div>
        </div>
    </main>

    <!-- Modal Game Over -->
    <div id="modal-gameover" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl max-w-md w-full text-center shadow-2xl fade-in">
            <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/20 rounded-2xl mx-auto flex items-center justify-center text-amber-400 text-3xl mb-4"><i class="fa-solid fa-trophy"></i></div>
            <h2 id="end-title" class="text-2xl font-extrabold text-white mb-1"></h2>
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 my-4">
                <span id="final-prize" class="text-3xl font-black text-amber-400">0 Điểm</span>
            </div>
            <button id="btn-home" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-amber-600 text-slate-950 font-extrabold rounded-xl cursor-pointer transition-all">VỀ TRANG CHỦ</button>
        </div>
    </div>

    <!-- Liên kết file JavaScript tùy chỉnh (nếu tách file) -->
    <script src="script.js"></script>
</body>
</html>
